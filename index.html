<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14251d"><title>Reino Medieval RTS</title><style>
:root{--gold:#e4c16b;--panel:#17271feF;--line:#a88a4e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#203923;color:#fff;font-family:system-ui,Arial;touch-action:none}#game{display:block;width:100%;height:100%;background:#527b43}.hud{position:absolute;left:0;right:0;display:flex;gap:5px;align-items:center;padding:6px;background:linear-gradient(#14251df2,#14251da8);font-weight:700;text-shadow:1px 2px #000}.top{top:0;justify-content:space-between;font-size:clamp(9px,2vw,14px);flex-wrap:wrap}.pill,.card,button{border:1px solid var(--line);border-radius:8px;background:#263c2b;color:#fff;padding:6px 8px;white-space:nowrap}.right{position:absolute;right:6px;top:66px;display:flex;flex-direction:column;gap:5px}.right button{font-weight:800}.bottom{bottom:0;overflow-x:auto;justify-content:flex-start;padding-bottom:calc(6px + env(safe-area-inset-bottom))}.card{min-width:76px;text-align:center;font-size:10px}.card b{display:block;font-size:20px}.card.sel{background:#80622d;border:2px solid #ffe28a}.msg{position:absolute;left:50%;top:66px;transform:translateX(-50%);background:#17251ef2;border:1px solid #e8ce84;border-radius:9px;padding:7px 10px;font-size:11px;pointer-events:none;max-width:85%;text-align:center}.help{position:absolute;left:6px;bottom:82px;background:#17251ec9;padding:5px 7px;border-radius:8px;font-size:9px;pointer-events:none}.panel{position:absolute;left:6px;right:6px;top:108px;bottom:84px;max-height:65%;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:10px;display:none;box-shadow:0 8px 28px #0009}.panel.open{display:block}.panel h3{margin:2px 0 8px;color:#ffe29a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.item{white-space:normal;text-align:left;min-height:54px;background:#2b4330}.item small{display:block;color:#e9d59e;font-size:10px;margin-top:3px}.toolbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.toolbar button.active{background:#80622d}.close{float:right}.muted{color:#c9d0c4;font-size:11px}.bar{height:5px;background:#222;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#77d66d}.top .pill{padding:4px 6px}.hidden{display:none!important}
</style></head><body><canvas id="game"></canvas><div class="hud top"><span class="pill">🏰 REINO RTS · <span id="era">Fundação</span></span><span class="pill">🪙 <span id="gold">600</span></span><span class="pill">🪵 <span id="wood">350</span></span><span class="pill">🪨 <span id="stone">250</span></span><span class="pill">⚒️ <span id="iron">80</span></span><span class="pill">🍖 <span id="food">180</span></span><span class="pill">💎 <span id="crystal">20</span></span></div><div class="right"><button id="menu">☰ Menu</button><button id="pause">Ⅱ Pausar</button><button id="save">💾 Salvar</button></div><div class="msg" id="msg">Escolha uma categoria e construa seu reino.</div><div class="help">Toque no terreno para construir · selecione tropas e toque para mover · toque em inimigos para atacar</div><section class="panel open" id="panel"><button class="close" id="close">✕</button><h3 id="panelTitle">Comandos do Reino</h3><div class="toolbar" id="tabs"></div><div id="panelBody"></div></section><div class="hud bottom" id="cards"></div><script src="game.js"></script></body></html>
